[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spqrmigrate"
version = "0.1.0"
description = "A proof of concept for SPQR metadata migrations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["psycopg2-binary>=2.9.11", "sqlparse>=0.5.5", "PyYAML>=6.0.3"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.12"]

[project.scripts]
spqrmigrate = "spqrmigrate.cli:main"

[tool.setuptools.packages.find]
include = ["spqrmigrate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
