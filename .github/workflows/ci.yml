name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make lint
      - run: make build
      - name: Install wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/spqrmigrate" --help
          "$RUNNER_TEMP/wheel-venv/bin/python" -I -m spqrmigrate --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  unit:
    name: Unit / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-14
            python: '3.10'
          - os: macos-14
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make test PYTEST_ARGS='-q --fail-on-skip tests/test_poc.py tests/test_console.py'

  reference:
    name: pgmigrate compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PGMIGRATE_REFERENCE: ${{ github.workspace }}/pgmigrate-reference.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Fetch pgmigrate 1.0.13 reference
        run: |
          curl --fail --location --retry 3 --max-time 60 \
            https://raw.githubusercontent.com/yandex/pgmigrate/a3c7250ae253e59866c380baf71fcf06b5a81cee/pgmigrate.py \
            --output "$PGMIGRATE_REFERENCE"
          echo "0fa9f753199cef508141d50bdc93415862711f929c95cfd6f0bcdc9ab9e54f97  $PGMIGRATE_REFERENCE" | sha256sum --check
      - run: make test PYTEST_ARGS='-q --fail-on-skip tests/test_reference.py'

  integration:
    name: SPQR and etcd
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPQRMIGRATE_TEST_DSN: host=127.0.0.1 port=57432 dbname=spqr-console user=admin connect_timeout=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out pinned SPQR with native migration journal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: pg-sharding/spqr
          ref: 1ada44d557ba928df5c3cc6bdc70577361a8bb28
          path: .ci/spqr
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .ci/spqr/go.mod
          cache-dependency-path: .ci/spqr/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build unmodified coordinator
        working-directory: .ci/spqr
        run: go build -mod=readonly -o "$RUNNER_TEMP/spqr-coordinator" ./cmd/coordinator
      - name: Fetch etcd 3.6.0
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/etcd-io/etcd/releases/download/v3.6.0/etcd-v3.6.0-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/etcd.tar.gz"
          echo "42305b0dcbba7b6fdff0382d0c7b99c42026c88c44847a619ab58cde216725d9  $RUNNER_TEMP/etcd.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/etcd.tar.gz" -C "$RUNNER_TEMP"
      - name: Prepare native Unix socket directory
        run: sudo install -d -m 0777 /var/run/postgresql
      - name: Test Console and restart persistence
        env:
          SPQRMIGRATE_TEST_COORDINATOR: ${{ runner.temp }}/spqr-coordinator
          SPQRMIGRATE_TEST_ETCD: ${{ runner.temp }}/etcd-v3.6.0-linux-amd64/etcd
        run: |
          make test PYTEST_ARGS="-q --fail-on-skip tests/test_live_console.py --basetemp=$RUNNER_TEMP/integration --junitxml=$RUNNER_TEMP/integration.xml"
      - name: Upload integration logs and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-logs
          path: |
            ${{ runner.temp }}/integration/**/*.log
            ${{ runner.temp }}/integration/**/*.yaml
            ${{ runner.temp }}/integration.xml
          if-no-files-found: warn
          retention-days: 14

  ci:
    name: CI passed
    if: always()
    needs: [quality, unit, reference, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              sys.exit('Required jobs did not succeed: ' + ', '.join(failed))
          PY
